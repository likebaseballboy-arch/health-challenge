<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康進擊班｜血糖×睡眠雙重攻防戰</title><style> :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#19332e;background:#edf6f3}*{box-sizing:border-box}body{margin:0}main{max-width:600px;margin:auto;padding:20px 15px 50px}.card{background:white;border-radius:22px;padding:23px 19px;box-shadow:0 8px 28px #123a2914;margin-top:14px}h1{font-size:29px;line-height:1.3;margin:8px 0}h2{font-size:22px;line-height:1.45}p{line-height:1.65}.eyebrow{color:#267f68;font-weight:800;letter-spacing:1px}.pill{display:inline-block;background:#e3f4ea;color:#14634d;border-radius:30px;padding:6px 12px;font-size:13px;font-weight:800}.button,.opt{font:inherit;border:0;cursor:pointer}.button{background:#147c65;color:white;padding:15px 20px;border-radius:13px;font-weight:800;width:100%;margin-top:16px}.button:disabled{opacity:.4}.opt{width:100%;text-align:left;background:#f6f9f7;border:2px solid #e0e9e4;border-radius:14px;padding:15px;margin:7px 0;line-height:1.5;color:#18382f}.opt.selected{border-color:#197c65;background:#e9f7f1}.opt.good{border-color:#1b986e;background:#e3f8ee}.opt.bad{border-color:#c85757;background:#fff0f0}.bar{height:10px;background:#e2ebe6;border-radius:20px;overflow:hidden}.fill{height:100%;background:#27a67d;transition:width .25s}.top{display:flex;justify-content:space-between;margin:12px 0;font-weight:800}.explain{background:#f0f7ed;border-left:4px solid #299a70;padding:12px 14px;border-radius:8px;margin-top:12px;line-height:1.6}.muted{color:#64746c;font-size:13px}.score{font-size:55px;font-weight:900;color:#137e61} .hide{display:none}label{display:block}</style></head><body><main><div class="card" id="start"><div class="eyebrow">健康進擊班｜本週進階挑戰</div><h1>🌾🌙 血糖 × 睡眠<br>雙重攻防戰</h1><p>把 GI、睡眠與日常營養選擇，變成真正用得上的生活智慧。</p><span class="pill">20題單選 × 5分</span> <span class="pill">2題Bonus × 10分</span><p>滿分120分｜90分以上獲得摸彩券1張 🎟️</p><p class="muted">題目有難度！選項會隨機排列，答題後提供解析；Bonus需全選正確才得分。</p><button class="button" onclick="begin()">開始挑戰 ⚔️</button></div><div id="play" class="hide"><div class="card"><div class="top"><span id="counter"></span><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="muted" id="kind" style="margin-top:12px"></div><h2 id="question"></h2><div id="choices"></div><div id="feedback"></div><button class="button" id="next" onclick="advance()" disabled>確認答案</button></div></div><div class="card hide" id="end"><div class="eyebrow">挑戰完成</div><h1 id="rank"></h1><div class="score" id="final"></div><p id="ticket"></p><p>📸 截圖這個成績，傳到健康進擊班群組！</p><button class="button" onclick="location.reload()">再挑戰一次</button></div><p class="muted" style="text-align:center">營養教育用途；GI會受食材、加工、烹調與份量影響。營養補充品不能取代均衡飲食、足夠睡眠或醫療照護。</p></main><script>const Q=[["早餐只有5分鐘，你會怎麼安排？", ["奶昔搭配蛋白質並評估份量", "只喝黑咖啡留熱量到中午", "只吃水果等到下午再補", "固定兩條點心棒取代三餐"], 0, "方便的早餐仍要考慮蛋白質、纖維、熱量及全天飲食。"], ["低GI食品標示讓你最應該想到？", ["份量再大也不影響體重", "仍要看份量與總熱量", "可以完全不考慮含糖量", "一定比所有高GI食物健康"], 1, "GI不代表熱量高低，也不能取代完整營養標示。"], ["連續幾天睡5小時又想吃甜食，先做什麼？", ["只改成無糖甜點", "早餐完全不吃澱粉", "檢視睡眠與三餐內容", "靠運動抵銷睡眠不足"], 2, "睡眠不足可能影響食慾，也要檢視三餐搭配。"], ["晚上10點喝無糖綠茶後難入睡，怎麼調整？", ["改成無糖紅茶", "睡前加強高強度運動", "改喝同量黑咖啡", "將咖啡因提前或減少"], 3, "無糖不等於無咖啡因；晚間攝取可能影響睡眠。"], ["吃地瓜就一定比白飯更好嗎？", ["不一定，需看份量和搭配", "一定，地瓜熱量必定更低", "一定，地瓜完全不影響血糖", "不一定，但只看食物顏色"], 0, "GI、GL、份量、烹調及整餐組成都重要。"], ["午餐吃麵後下午疲倦，最合理的想法？", ["一定是麵條GI太高", "需一起看睡眠與餐食份量", "表示以後不能再吃麵", "只要改喝果汁就能改善"], 1, "疲倦原因多元，不應只用單一食物GI解釋。"], ["週末晚睡，週一要早起，較好的策略？", ["週日睡到下午再說", "週日晚餐完全不吃", "盡量維持規律起床時間", "週一靠大量咖啡撐整天"], 2, "規律作息與足夠睡眠有助於睡眠品質。"], ["低GI堅果當點心，最需注意？", ["只有GI不必看其他", "堅果完全沒有熱量", "一次吃越多越有飽足感", "營養密度高仍需看份量"], 3, "堅果含健康脂肪，也提供熱量。"], ["運動後晚餐想吃澱粉，哪個觀念較合理？", ["依活動量安排適當碳水", "運動後完全不能吃主食", "只要低GI就能無限吃", "先不吃晚餐隔天再補"], 0, "運動後仍需依需求補充能量與蛋白質。"], ["挑選蛋白點心棒時，最實用的比較方式？", ["只看包裝上的高蛋白", "同時看蛋白質糖與熱量", "只看產品外觀和口味", "只看是否標示低脂肪"], 1, "營養標示與食用情境都要一起考量。"], ["某人有補充五味子，卻每天只睡4小時，該怎麼看？", ["可以把睡眠縮短到3小時", "增加補充品即可抵銷熬夜", "補充不能取代足夠睡眠", "週末多吃蛋白質就夠"], 2, "補充品不等於治療失眠或彌補睡眠不足。"], ["睡前餓了，最值得先評估？", ["只選最低GI就可以", "完全禁止任何夜間進食", "喝含咖啡因飲料壓飢餓", "晚餐份量及實際飢餓程度"], 3, "先了解是否真的餓、全天攝取是否足夠。"], ["吃一樣的白飯，兩人血糖反應不同，為什麼？", ["個人狀況與整餐搭配不同", "白飯的GI會因人變成零", "其中一人一定測量錯誤", "GI完全不具有參考價值"], 0, "個體反應也受活動、睡眠、份量等影響。"], ["選擇營養蛋白素搭配早餐時，先確認什麼？", ["顏色是否與早餐相同", "整餐蛋白質及熱量需求", "是否能取代所有蔬菜", "喝越濃效果一定越好"], 1, "蛋白粉是補充工具，應依飲食需求調整。"], ["每天睡7到9小時仍長期疲倦，怎麼做？", ["直接把睡眠拉到12小時", "只改吃低GI食物即可", "留意睡眠品質並諮詢醫師", "每天晚上加喝提神飲料"], 2, "睡眠時數之外，睡眠品質與健康狀況也重要。"], ["看到鈣片含鈣、鎂、維生素D，哪個想法正確？", ["能保證當晚睡得更好", "可代替醫師處理失眠", "吃越多越容易放鬆", "補充營養不等於治療失眠"], 3, "應依標示與個人需求使用，不可當作失眠藥物。"], ["想降低整餐的升糖負荷，較合理的調整？", ["減少精製主食份量並搭配蔬菜", "只把白飯換成一大盤麵", "餐後補喝一杯含糖飲料", "完全不考慮吃下的碳水量"], 0, "GL與實際碳水量相關，整餐搭配也有影響。"], ["下午四點喝咖啡，晚上十一點睡不著，先試？", ["把咖啡換成同量能量飲", "調整咖啡因的時間與份量", "睡前多滑手機轉移注意", "把晚餐主食完全取消"], 1, "咖啡因代謝速度因人而異，可提早停止攝取。"], ["看到當歸錠宣稱幫助睡眠，最合理的態度？", ["有產品就不用固定作息", "任何人都能自行加倍服用", "先看合法標示與適用限制", "能直接替代失眠醫療評估"], 2, "產品宣稱應依核准標示，不可推定能治療失眠。"], ["減脂停滯又常熬夜，哪種調整最有長期價值？", ["每天再少吃一餐", "運動量立刻增加一倍", "只改吃GI最低的食物", "檢視睡眠飲食活動與壓力"], 3, "減脂需綜合評估，不應只做極端節食。"]],B=[["你一週常熬夜、下午喝奶茶、晚餐吃很快。哪些調整值得試？", ["固定起床與睡覺時間", "觀察下午飲品咖啡因", "晚餐搭配蔬菜與蛋白質", "用補充品取代睡眠", "週末完全不吃澱粉"], [0, 1, 2], "睡眠節律、飲品與均衡飲食都值得改善。"], ["選擇低GI飲食與營養補充時，哪些觀念正確？", ["低GI仍需看食用份量", "蛋白粉可依需求補足蛋白質", "鈣片不能取代失眠治療", "五味子可抵銷長期熬夜", "點心棒可永久取代正餐"], [0, 1, 2], "低GI不代表低熱量；補充品無法取代飲食與醫療。"]];let idx=0,score=0,selected=[],locked=false,order=[];const $=id=>document.getElementById(id);function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1])}function begin(){$('start').classList.add('hide');$('play').classList.remove('hide');render()}function render(){locked=false;selected=[];let bonus=idx>=Q.length,d=bonus?B[idx-Q.length]:Q[idx];order=shuffle(d[1].map((t,i)=>({t,i})));$('counter').textContent=`第 ${idx+1} / ${Q.length+B.length} 題`;$('points').textContent=`${score} / 120 分`;$('fill').style.width=`${idx/(Q.length+B.length)*100}%`;$('kind').textContent=bonus?'🎁 BONUS 複選題｜全對 +10 分':'🧠 進階單選題｜答對 +5 分';$('question').textContent=d[0];$('feedback').innerHTML='';$('next').disabled=true;$('next').textContent='確認答案';$('choices').innerHTML='';order.forEach((v,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+k)+'．'+v.t;b.onclick=()=>pick(v.i);b.dataset.id=v.i;$('choices').appendChild(b)})}function pick(id){if(locked)return;let bonus=idx>=Q.length;if(!bonus)selected=[id];else selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];document.querySelectorAll('.opt').forEach(el=>el.classList.toggle('selected',selected.includes(+el.dataset.id)));$('next').disabled=!selected.length}function advance(){if(locked){idx++;if(idx===Q.length+B.length)return finish();render();return}let bonus=idx>=Q.length,d=bonus?B[idx-Q.length]:Q[idx],correct=bonus?d[2]:[d[2]],ok=selected.length===correct.length&&selected.every(x=>correct.includes(x));if(ok)score+=bonus?10:5;locked=true;document.querySelectorAll('.opt').forEach(el=>{let n=+el.dataset.id;el.classList.remove('selected');if(correct.includes(n))el.classList.add('good');else if(selected.includes(n))el.classList.add('bad')});$('feedback').innerHTML=`<div class="explain"><b>${ok?'✅ 答對了！':'💡 這題再記住一個觀念！'}</b><div>${d[3]}</div></div>`;$('points').textContent=`${score} / 120 分`;$('next').textContent=idx===Q.length+B.length-1?'查看成績':'下一題 →'}function finish(){$('play').classList.add('hide');$('end').classList.remove('hide');$('final').textContent=score+' / 120';$('rank').textContent=score>=110?'👑 血糖睡眠雙冠王':score>=90?'🏆 健康生活攻防高手':score>=70?'🌱 健康習慣實踐家':'💪 健康進擊挑戰者';$('ticket').textContent=score>=90?'🎟️ 恭喜達標！可獲得摸彩券1張':'繼續加油！再挑戰一次，向90分邁進！';window.scrollTo(0,0)}</script></body></html>
